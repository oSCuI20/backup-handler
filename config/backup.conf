_QUIET=true
_DEBUG=false

# Enable backups
_RUN_BACKUP_FILES=true #true|false
_RUN_BACKUP_MYSQL=false  #true|false
_RUN_BACKUP_POSTGRESQL=false  #true|false
_RUN_BACKUP_VBOX=false  #true|false

_ARCHIVEROOT=

## backups files options
RCLONE_CONFIG_FILE=./config/rclone.conf
RCLONE_BACKUP_REMOTE=   #<rclone-config>
RCLONE_BACKUP_OPTIONS=  #--backup-dir <rclone-config>:path/to/increment

BACKUP_DIR=(dir1 dir2)

## PostgreSQL
POSTGRESQL_HOST=
POSTGRESQL_USER=
POSTGRESQL_PASS=
POSTGRESQL_PORT=
POSTGRESQL_IGNORE=
POSTGRESQL_DATABASE=

# MySQL
MYSQL_HOST=
MYSQL_USER=
MYSQL_PASS=
MYSQL_PORT=
MYSQL_IGNORE="(information_schema|performance_schema|mysql)"

# Keep backups
DAYS=15

# Send email
EMAIL= #true|false
EMAILADDR=
EMAILSUBJECT="Backup host01"

# Slack notifications
# Defaults keys, title and msg ({"title": "Backups success", "msg": "backups finish at ..."})
SLACK= #true|false
CHANNEL=



# VBox values
TEMPDIR=/local/backups
VBOX_VM=(vbox01 vbox02)
VBOX_PATH="/local/vbox/VirtualBox\ VMs"
WEEK_DAY=6
